<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مختبر Computer Vision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study: clear, calm, a lab you poke at
   IDEA a pixel bench: every lesson is a live specimen you change and watch react
   PICTURE the working widget of each concept, drawn large, pixels visible
   COLOUR white / ink, one warm yellow slab for the key number, R G B as working colours
   TYPE IBM Plex Sans Arabic for everything, IBM Plex Mono for matrices and code
   LAYOUT top: title + lesson rail; each concept = text beside its widget; quiz closes the lesson; stacks under 820px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#101418);--ink:light-dark(#101418,#eef1f4);--mute:light-dark(#56616d,#9aa6b2);--panel:light-dark(#f3f4f6,#181e25);--line:light-dark(#dde1e6,#2a323c);--y:#ffd84a;--yink:#2a2100;--r:light-dark(#d62828,#ff6b6b);--g:light-dark(#1f8a3b,#4cd07a);--b:light-dark(#1f5fd6,#6aa2ff);--ok:light-dark(#1f8a3b,#4cd07a);--bad:light-dark(#c62828,#ff7b7b)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.65 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(30px,4.4vw,48px);line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:clamp(26px,3.2vw,38px);line-height:1.15;margin:0 0 6px}
h3{font-size:21px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
code,.mono,.mat,pre{font-family:"IBM Plex Mono",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
code{font-size:.92em;background:var(--panel);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{background:var(--panel);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:14px;line-height:1.5;margin:8px 0;text-align:left}
.calc{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14.5px;line-height:1.7}
.en{direction:ltr;unicode-bidi:isolate;font-weight:700}
blockquote{margin:10px 0;padding:10px 14px;border-inline-start:4px solid var(--y);background:var(--panel);direction:ltr;text-align:left;border-radius:0 8px 8px 0}
header.top{background:var(--y);color:var(--yink)}
header.top .row{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:end;justify-content:space-between}
.meter{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.meter .bar{width:160px;height:12px;background:#0002;border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--yink);border-radius:6px;transition:width .4s}
nav.rail{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.rail .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px max(4vw,16px);scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.chip b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--panel);font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on b{background:var(--y);color:var(--yink)}
.chip.done b{background:var(--ok);color:#fff}
.chip.lock{opacity:.5}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.lead{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:8px}
.sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(18px,3vw,40px);padding:28px 0;border-top:1px solid var(--line);align-items:start}
.sec.one{grid-template-columns:minmax(0,1fr)}
.lab{background:var(--panel);border-radius:14px;padding:16px;display:grid;gap:12px}
.lab .t{font-weight:700;font-size:15px;color:var(--mute)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.b{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
button.b:hover{border-color:var(--ink)}
button.b.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.b.main{background:var(--y);color:var(--yink);border-color:var(--y);font-weight:700}
label.sl{display:grid;grid-template-columns:auto minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:15px}
label.sl output{font-family:"IBM Plex Mono",monospace;font-weight:600;text-align:center;direction:ltr}
input[type=range]{width:100%;accent-color:var(--ink);height:28px;direction:ltr}
input[type=number],select{font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:6.5em;direction:ltr}
.big{font-size:clamp(30px,5vw,46px);font-weight:700;line-height:1.1;font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate}
.slab{background:var(--y);color:var(--yink);border-radius:10px;padding:10px 14px;display:inline-block}
canvas.px{width:100%;image-rendering:pixelated;border-radius:8px;display:block;background:#000;aspect-ratio:1}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cap{font-size:14px;color:var(--mute);text-align:center;margin-top:4px}
.mat{border-collapse:collapse;margin:4px 0;font-size:14px}
.mat td{width:2.6em;height:2.2em;text-align:center;border:1px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums}
.mat td.hl{background:var(--y);color:var(--yink);font-weight:700}
.mat td.c{outline:3px solid var(--b);outline-offset:-3px;font-weight:700}
.mat td.pad{color:var(--mute);background:var(--panel)}
.mat td.w{background:#ffd84a55}
.mat td.bg0{background:color-mix(in srgb,var(--b) 22%,var(--bg))}
.mat td.fg0{background:color-mix(in srgb,var(--r) 22%,var(--bg))}
.mat input{width:2.4em;border:0;background:transparent;color:inherit;text-align:center;font:inherit;font-size:15px;padding:4px 0}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:start;vertical-align:top}
table.t th{font-size:14px;color:var(--mute);font-weight:500}
table.t td.n{text-align:center;font-family:"IBM Plex Mono",monospace;white-space:nowrap;direction:ltr}
tr.best td{background:#ffd84a40;font-weight:700}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;direction:ltr;aspect-ratio:1}
.grid12 button{border:0;padding:0;border-radius:2px;cursor:pointer;min-height:0}
.grid12 button.roi{outline:2px solid var(--y);outline-offset:-2px}
.grid12 button.sel{outline:3px solid var(--ink);outline-offset:-1px}
.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;direction:ltr}
.bits button{min-height:58px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 22px "IBM Plex Mono",monospace;cursor:pointer;display:grid;place-items:center;line-height:1}
.bits button small{font-size:12px;font-weight:400;color:var(--mute)}
.bits button.one{background:var(--y);color:var(--yink);border-color:var(--y)}
.bits button.one small{color:var(--yink)}
.hrow{display:grid;grid-template-columns:3em minmax(0,1fr) 5.5em;gap:8px;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:14px;direction:ltr}
.hrow i{display:block;height:20px;background:var(--ink);border-radius:3px;transition:width .3s}
.fig{position:relative;min-height:260px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font-family:"IBM Plex Mono",monospace;font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:10px}
.card{background:var(--panel);border-radius:12px;padding:12px 14px}
.card b{display:block}
.note{font-size:15px;background:var(--panel);border-radius:10px;padding:10px 14px}
.quiz{background:var(--ink);color:var(--bg);border-radius:18px;padding:clamp(18px,3vw,32px);margin:28px 0 10px}
.quiz h2{color:var(--bg)}
.q{border-top:1px solid #ffffff2a;padding:16px 0}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:8px}
.opts button{min-height:46px;text-align:start;padding:8px 12px;border-radius:10px;border:1px solid #ffffff40;background:transparent;color:inherit;font:inherit;font-size:15.5px;cursor:pointer}
.opts button.pick{background:var(--y);color:var(--yink);border-color:var(--y)}
.opts button.right{background:#2e9d52;color:#fff;border-color:#2e9d52}
.opts button.wrong{background:#c33;color:#fff;border-color:#c33}
.q .ex{margin-top:8px;font-size:15px;opacity:.9;display:none}
.q.shown .ex{display:block}
.qres{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.qres .score{font:700 28px "IBM Plex Mono",monospace}
.toast{position:fixed;inset-inline:16px;bottom:16px;margin:auto;max-width:460px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;text-align:center}
.toast.on{opacity:1}
footer{color:var(--mute);font-size:14px}
@media(max-width:820px){.sec,.lead{grid-template-columns:minmax(0,1fr)}.meter .bar{width:110px}}
@media(max-width:480px){.trio{grid-template-columns:repeat(2,minmax(0,1fr))}.bits button{font-size:18px;min-height:52px}label.sl{grid-template-columns:minmax(0,1fr) 4em}label.sl input{grid-column:1/-1;grid-row:2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="top band">
  <div class="wrap row">
    <div>
      <h1>مختبر Computer Vision</h1>
      <p style="margin:0;max-width:60ch">سبع دروس بترتيب المحاضرات. بكل درس في أدوات بتحركها وبتشوف النتيجة بتتغير قدامك، وبآخره اختبار. <b>ما بينفتح الدرس اللي بعده إلا إذا جبت 80% أو أكثر.</b></p>
    </div>
    <div class="ctl" style="gap:14px"><div class="meter"><span id="mtxt">0 من 7</span><span class="bar"><i id="mbar" style="width:0"></i></span></div><button class="b" id="openall" style="background:#0000;border-color:var(--yink);color:var(--yink)">افتح كل الدروس</button></div>

</div></footer>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Number(n).toLocaleString('en-US');
const r2=n=>Math.round(n*100)/100;
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
let store={passed:[false,false,false,false,false,false,false],best:[0,0,0,0,0,0,0]};
try{const s=JSON.parse(localStorage.getItem('cv-lab-v1'));if(s&&Array.isArray(s.passed))store=s}catch(e){}
const save=()=>{try{localStorage.setItem('cv-lab-v1',JSON.stringify(store))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)};

/* ---------- pixel helpers ---------- */
function paint(cv,w,h,f){cv.width=w;cv.height=h;const c=cv.getContext('2d'),d=c.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=f(x,y),i=(y*w+x)*4;if(typeof p==='number'){d.data[i]=d.data[i+1]=d.data[i+2]=p}else{d.data[i]=p[0];d.data[i+1]=p[1];d.data[i+2]=p[2]}d.data[i+3]=255}c.putImageData(d,0,0);return c}
function sunset(N){seed=5;const a=new Float32Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const hz=N*.56;let v;if(y<hz){v=95+(y/hz)*95;const d=Math.hypot(x-N*.62,y-hz*.82);v+=Math.max(0,75-d*4.2)}else{v=60+38*Math.sin(x*.8+y*1.9)*Math.sin(y*.45);if(Math.abs(x-N*.62)<N*.07)v+=95}const px=N*.34;if(Math.abs(x-px)<N*.05&&y>N*.42&&y<N*.97)v=18;if(Math.hypot(x-px,y-N*.37)<N*.05)v=18;a[y*N+x]=clamp(v+(rnd()-.5)*14,0,255)}return a}
function blur(a,N){const o=new Float32Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let s=0,c=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const yy=y+j,xx=x+i;if(yy>=0&&yy<N&&xx>=0&&xx<N){s+=a[yy*N+xx];c++}}o[y*N+x]=s/c}return o}
const at=(a,N,x,y)=>a[clamp(y,0,N-1)*N+clamp(x,0,N-1)];
const mat=(m,cls)=>`<table class="mat">${m.map((row,y)=>`<tr>${row.map((v,x)=>`<td class="${cls?cls(x,y,v):''}">${v}</td>`).join('')}</tr>`).join('')}</table>`;
const range=(id,label,min,max,val,step=1)=>`<label class="sl"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}o">${val}</output></label>`;
const bindR=(root,id,fn)=>{const e=$('#'+id,root),o=$('#'+id+'o',root);const h=()=>{o.textContent=e.value;fn(+e.value)};e.addEventListener('input',h);h();return e};

/* ---------- lessons ---------- */
const ROs=[];const mkRO=f=>{const o=new ResizeObserver(f);ROs.push(o);return o};
const L=[];

/* ===== Lesson 1 ===== */
L.push({t:'مقدمة',h:'Introduction',intro:'شو هو الـ Computer Vision، ليش صعب، وكيف بيمشي الـ pipeline.',
html:()=>`
<div class="sec"><div>
<h3>التعريف</h3>
<blockquote>Computer Vision (CV) is a field of Artificial Intelligence (AI) that enables machines to interpret and understand visual information from the world.</blockquote>
<p>الكاميرا بتعطيك أرقام بس. الـ CV هو اللي بحوّل هالأرقام لمعنى. والجملة المهمة: <span class="en">CV works backward from images to infer properties of the world</span>، يعني من الصورة بنرجع نستنتج شو كان بالعالم.</p>
<p>بيشتغل زي عينك: <span class="en">Input → Sensing device → Interpreting device → Output</span>، والإنسان: مشهد ← عين ← دماغ ← تعرّف.</p>
</div><div class="cards">
<div class="card"><b class="en">Object Detection & Recognition</b>تحديد الأجسام وتسميتها. <span class="mute en" style="font-weight:400">Classification → + Localization → Object Detection</span></div>
<div class="card"><b class="en">3D Reconstruction</b>نموذج ثلاثي الأبعاد من صور 2D من زوايا مختلفة.</div>
<div class="card"><b class="en">Motion Analysis</b>تتبع حركة الأجسام عبر الفيديو.</div>
<div class="card"><b class="en">Biomedical Imaging</b>تحليل X-rays و MRI و CT.</div>
<div class="card"><b class="en">Face Recognition</b>كشف الوجوه وتحليلها وتمييزها.</div>
</div></div>

<div class="sec"><div>
<h3>ليش الـ CV صعب؟ جرّب بنفسك</h3>
<p>اضغط على كل تحدي وشوف كيف <b>نفس الطابة</b> بتطلع بأرقام مختلفة كليًا. الكمبيوتر ما بشوف "طابة"، بشوف المصفوفة اللي تحت.</p>
<table class="t"><tr><td class="en">Viewpoint</td><td>الكاميرا تحركت، مصفوفة البكسلات تغيرت كليًا</td></tr><tr><td class="en">Deformation</td><td>الأجسام غير الصلبة بتتشوه</td></tr><tr><td class="en">Occlusion</td><td>جزء من الجسم مخفي ورا جسم ثاني</td></tr><tr><td class="en">Illumination</td><td>الإضاءة بتغيّر البكسلات بشكل جذري</td></tr><tr><td class="en">Motion</td><td>الحركة بتغبّش الجسم</td></tr></table>
<p class="note">الإنسان بيتعرف بسهولة لأنه عنده خبرة يومية بالأشكال والألوان، والكمبيوتر بيحتاج <span class="en">suitable algorithms + representative training data + robust models</span>.</p>
</div><div class="lab">
<div class="ctl" id="chal"></div>
<canvas id="chc" style="width:100%;aspect-ratio:3/2;border-radius:8px;display:block"></canvas>
<div class="t">قيم الرمادي (متوسط كل مربع) اللي الكمبيوتر فعليًا بشوفها:</div>
<div class="scroll" id="chm"></div>
</div></div>

<div class="sec"><div>
<h3>The Computer Vision Pipeline</h3>
<p>خمس خطوات بالترتيب. اضغط على كل خطوة وشوف الصورة شو بيصير فيها.</p>
<div id="pdesc" class="note"></div>
<p class="mute">🧠 حفظ: Acquisition, Preprocessing, Segmentation, Feature extraction, Classification.</p>
</div><div class="lab">
<div class="ctl" id="pbtn"></div>
<div style="position:relative"><canvas class="px" id="pcv"></canvas><div id="plab" class="slab" style="position:absolute;top:10px;inset-inline-start:10px;display:none"></div></div>
</div></div>

<div class="sec"><div>
<h3>أنواع الصور والـ Resolution</h3>
<p><b class="en">Binary</b>: 0 أو 1 بس. <b class="en">Grayscale</b>: من 0 (أسود) لـ 255 (أبيض). <b class="en">Color</b>: 3 قنوات RGB.</p>
<p><b>Resolution</b>: عدد البكسلات. أكثر ← تفاصيل أوضح. أقل ← <span class="en">pixelation</span>. حرّك السلايدر.</p>
</div><div class="lab">
<div class="trio"><div><canvas class="px" id="ty0"></canvas><div class="cap">Binary</div></div><div><canvas class="px" id="ty1"></canvas><div class="cap">Grayscale</div></div><div><canvas class="px" id="ty2"></canvas><div class="cap">Color</div></div></div>
${range('res','Resolution',4,96,24)}
</div></div>`,
init(R){
 const ch=['عادي','Viewpoint','Deformation','Occlusion','Illumination','Motion'];
 const cv=$('#chc',R);let cur=0;
 const draw=()=>{const W=360,H=240;cv.width=W;cv.height=H;const c=cv.getContext('2d');c.fillStyle='#3d8a4a';c.fillRect(0,0,W,H);
  const ball=(x,y,sx,sy,alpha)=>{c.save();c.globalAlpha=alpha;c.translate(x,y);c.scale(sx,sy);c.fillStyle='#f4f4f4';c.beginPath();c.arc(0,0,58,0,7);c.fill();c.fillStyle='#d1284a';for(let k=0;k<5;k++){c.beginPath();c.arc(Math.cos(k*1.26)*34,Math.sin(k*1.26)*34,16,0,7);c.fill()}c.beginPath();c.arc(0,0,14,0,7);c.fill();c.restore()};
  if(cur===1){ball(180,120,.55,1,1)}else if(cur===2){ball(180,150,1.5,.55,1)}else if(cur===5){for(let k=0;k<6;k++)ball(120+k*24,120,1,1,.28)}else ball(180,120,1,1,1);

html:()=>`
<div class="sec"><div>
<h3>16-bit: ليش الأحمر 5 bits بس؟</h3>
<p>بالـ 16-bit (<span class="en">RGB565</span>) الأحمر 5 bits = 32 قيمة (0 لـ 31) بدل 256. فلازم نحوّل:</p>
<p class="big" style="font-size:24px">R₅ = R₈ × 31 / 255</p>
<p>31 = 2⁵ − 1، و 255 = 2⁸ − 1. أمثلة السلايد: 255 ← 31، 128 ← 16، 64 ← 8.</p>
<p class="mute">32 × 64 × 32 = 65,536 لون بالـ 16-bit، مقابل 16,777,216 بالـ 24-bit.</p>
</div><div class="lab">

<p><b class="en">Vector image</b>: مرسومة بمعادلات رياضية مش pixels. بتخزّن تعليمات زي "ارسم دائرة". لما تكبّر، الكمبيوتر بيعيد الحساب فبتضل حادة.</p>

<p>⭐ خصائص الـ vector الأربع: <b>Mathematical representation · Scalability · Efficient storage · Easy editing</b>.</p>

<p class="mute">والخط: y = mx + c، و m = (y₂−y₁)/(x₂−x₁). مثال السلايد A(2,1) و B(8,4): m = 0.5، c = 0، y = 0.5x.</p>

<p class="mono" style="font-size:14px">B(t) = (1−t)² P₀ + 2(1−t)t P₁ + t² P₂ ، 0 ≤ t ≤ 1</p>
<p>P₀ = (0,0) بداية، <b>P₁ = (2,4) control point</b> بيحدد الشكل، P₂ = (4,0) نهاية. حرّك t وشوف النقطة بتمشي.</p>

<div class="sec"><div>
<h3>Compression ⭐</h3>
<p>الهدف: نصغّر الملف عشان <b>التخزين والنقل</b>. الحجم الخام: <span class="mono">S_raw = W·H·C·b / 8</span> (بدون headers و metadata).</p>
<div class="scroll"><table class="t"><tr><th></th><th>Lossless</th><th>Lossy</th></tr>
<tr><td>البيانات</td><td>ما في أي فقدان، بترجع الأصلية تمامًا</td><td>بيانات بتنحذف للأبد، الفرق غالبًا ما بينلاحظ</td></tr>
<tr><td>النسبة</td><td>أقل</td><td>أعلى</td></tr>
<tr><td>أمثلة</td><td class="en">PNG, GIF, TIFF</td><td class="en">JPEG, WebP</td></tr></table></div>
<p class="mono" style="font-size:14px">CR = S_raw / S_compressed ، bpp = 8·S_compressed / (W·H)</p>
<p class="mute">CR أكبر = ملف أصغر. bpp أقل = bits أقل لكل pixel. ولا واحد منهم بيضمن الجودة لحاله.</p>

 bindR(R,'al',v=>{if($('#lk',R).checked){$('#be',R).value=r2(1-v);$('#beo',R).textContent=r2(1-v)}bl()});bindR(R,'be',()=>{$('#lk',R).checked=false;bl()});bindR(R,'ga',bl);
 const S=96,img=sunset(S);paint($('#t0',R),S,S,(x,y)=>img[y*S+x]);

 $('#ttab',R).innerHTML+=types.map(t=>`<tr><td class="en">${t[0]}</td><td>${t[2]}</td><td>${t[3]}</td></tr>`).join('');
 let ti=0;$('#tty',R).innerHTML=types.map((t,i)=>`<button class="b ${i?'':'on'}" data-i="${i}">${t[0]}</button>`).join('');

  $('#tex',R).innerHTML=`${tm?'T = img.mean()   # Lab 4 → '+T+'<br>print(T)<br>':''}ret, out = cv2.threshold(img, ${T}, 255, cv2.THRESH_${types[ti][0]})<br>pixel 200 → ${f(200,T)} ، pixel 50 → ${f(50,T)}`};

 $$('#tty button',R).forEach(b=>b.onclick=()=>{ti=+b.dataset.i;$$('#tty button',R).forEach(x=>x.classList.toggle('on',x===b));thr()});bindR(R,'th',thr);const ro3=mkRO(thr);ro3.observe($('#hsv',R));

 const mi=()=>{$('#mmi',R).innerHTML=M.map((r,y)=>`<tr>${r.map((v,x)=>`<td><input type="number" min="0" max="255" value="${v}" data-y="${y}" data-x="${x}" aria-label="I ${y} ${x}"></td>`).join('')}</tr>`).join('');$$('#mmi input',R).forEach(e=>e.oninput=()=>{M[+e.dataset.y][+e.dataset.x]=clamp(+e.value||0,0,255);mm()});mm()};

L.push({t:'Adaptive Thresholding',h:'Adaptive Thresholding (Mean and Gaussian)',intro:'لما الإضاءة مش متساوية: T لكل pixel من جيرانه.',
html:()=>`
<div class="sec"><div>
<h3>ليش الـ global بيفشل؟</h3>
<p>ورقة Sudoku: اليسار غامق واليمين فاتح. <b>T واحد</b> ما بيزبط للجهتين: يا الغامق بيصير أسود كله، يا الفاتح بيختفي.</p>
<p><b>Adaptive Thresholding</b>: بنحسب T لكل <b>منطقة صغيرة (window)</b> حوالين كل pixel، فبيطلع إلنا thresholds كثير بنفس الصورة.</p>
<p>جرب: حرك T تبع الـ global وشوف إنك ما بتلاقي قيمة بتزبط كل الورقة. بعدين حرك blockSize و C.</p>
<pre>cv2.adaptiveThreshold(img, 255,
    cv2.ADAPTIVE_THRESH_MEAN_C,
    cv2.THRESH_BINARY, 9, 3)
#   blockSize = 9 , C = 3</pre>
</div><div class="lab">
<div class="trio"><div><canvas class="px" id="s0"></canvas><div class="cap">Original</div></div><div><canvas class="px" id="s1"></canvas><div class="cap">Global</div></div><div><canvas class="px" id="s2"></canvas><div class="cap" id="acap">Adaptive Mean</div></div></div>
<div class="ctl"><button class="b on" id="am">ADAPTIVE_THRESH_MEAN_C</button><button class="b" id="ag">ADAPTIVE_THRESH_GAUSSIAN_C</button></div>
${range('gt','Global T',0,255,110)}${range('ab','blockSize',3,31,15,2)}${range('ac','C',0,20,6)}
<pre id="acode"></pre>
</div></div>

<div class="sec"><div>
<h3>خطوة بخطوة على مثال السلايد ⭐</h3>
<p class="en" style="font-weight:500">1 Grayscale → 2 Padding → 3 Select window → 4 Local mean → 5 T = mean − C → 6 Compare (≥ T → 255)</p>
<p><b>Replication padding</b>: نكرر أول صف فوق، آخر صف تحت، أول عمود يسار، آخر عمود يمين. 5×5 ← 7×7. (في كمان <b>zero padding</b> = إطار أصفار.)</p>
<p><b>اضغط على أي pixel بالصورة الأصلية</b> وشوف الـ window تبعه بالـ padded والحساب كامل. وبدّل بين Mean و Gaussian.</p>
<div class="ctl"><button class="b on" id="mmean">Mean</button><button class="b" id="mgau">Gaussian</button><label class="ctl">C <input type="number" id="cc" value="2" min="0" max="20"></label><button class="b main" id="all">احسب كل البكسلات</button></div>
</div><div class="lab">
<div class="duo"><div><div class="t">Original 5×5</div><div class="scroll" id="o5"></div></div><div><div class="t">Padded 7×7</div><div class="scroll" id="p7"></div></div></div>
<div class="calc" id="aw6" style="font-size:14px"></div>
<div><div class="t">Binary result</div><div class="scroll" id="r5"></div></div>
</div></div>

<div class="sec"><div>
<h3>شو هو C وكيف بنختاره؟ ⭐</h3>
<p><b>C</b> رقم ثابت صغير بنطرحه من الـ mean: <span class="mono">T = mean − C</span>. بيخلي T أقل شوي من متوسط الجيران، فالتفاصيل الغامقة (نص، حواف) بتنكشف صح.</p>
<div class="cards"><div class="card"><b>بالتجربة</b>عادة رقم صغير بين 2 و 10</div><div class="card"><b>صورة فاتحة جدًا</b>C أكبر</div><div class="card"><b>صورة غامقة</b>C أصغر أو حتى 0</div></div>
<p class="note">⚠️ المصفوفة النهائية بسلايد 20 مختلفة عن اللي بتطلع بالحساب (الصف الأخير بس فيه 0). امشِ على الخطوات بالامتحان.</p>
</div><div>
<h3>Gaussian Adaptive</h3>
<p>بدل المتوسط العادي، <b>متوسط موزون</b>: الـ pixels القريبة من المركز إلها وزن أكبر.</p>
<p class="mono" style="font-size:14px">G(x,y) = 1/(2πσ²) · e^(−(x²+y²)/2σ²)</p>
<div class="scroll">${mat([[0.0625,0.125,0.0625],[0.125,0.25,0.125],[0.0625,0.125,0.0625]],(x,y)=>x===1&&y===1?'hl':'')}</div>
<p>النتيجة: أحسن مع <b>uneven lighting</b>، صورة أنعم وأطبيعية، و noise أقل حول الحواف.</p>
<div class="scroll"><table class="t"><tr><th></th><th>Mean</th><th>Gaussian</th></tr><tr><td>T من</td><td>متوسط عادي</td><td>متوسط موزون</td></tr><tr><td>الأوزان</td><td>كلها 1/9</td><td>المركز 0.25، الزوايا 0.0625</td></tr><tr><td>OpenCV</td><td class="en">ADAPTIVE_THRESH_MEAN_C</td><td class="en">ADAPTIVE_THRESH_GAUSSIAN_C</td></tr></table></div>
</div></div>`,
init(R){

<p><b>Background</b> = ≤ T ، <b>Foreground</b> = &gt; T</p>
<p class="mono">T* = arg max ( H_bg + H_fg )<br>H = − Σ p log₂(p)</p>
<p>الخطوات: نقسم ← نطبّع الاحتمالات <b>جوّا كل منطقة</b> (نقسم على مجموعها) ← نحسب H لكل منطقة ← نجمع ← ناخذ الأكبر.</p>

<p>استخداماتها: boundary detection، feature extraction، و preprocessing للـ segmentation.</p>

 const si=()=>{$('#sin',R).innerHTML=S.map((r,y)=>`<tr>${r.map((v,x)=>`<td><input type="number" value="${v}" data-y="${y}" data-x="${x}" aria-label="I ${y} ${x}"></td>`).join('')}</tr>`).join('');$$('#sin input',R).forEach(e=>e.oninput=()=>{S[+e.dataset.y][+e.dataset.x]=+e.value||0;sob()});sob()};
 $$('#spre button',R).forEach(b=>b.onclick=()=>{S=pres[+b.dataset.i][1].map(r=>[...r]);$$('#spre button',R).forEach(x=>x.classList.toggle('on',x===b));si()});
 const ro4=mkRO(sob);ro4.observe($('#ssv',R));si();
},
quiz:[
{q:'بالـ normalized histogram، p(i) =',o:['count(i) × N','count(i) / N','N / count(i)','count(i) / 255'],a:1,e:'N = عدد البكسلات الكلي = W × H.'},
{q:'بـ Kapur، الـ background هي البكسلات اللي قيمتها:',o:['> T','≤ T','= T بس','≥ 255'],a:1,e:'Background ≤ T ، Foreground > T.'},
{q:'Entropy لمنطقة احتمالاتها {0.5, 0.5}:',o:['0','0.5','1','2'],a:2,e:'−(0.5·(−1) + 0.5·(−1)) = 1 bit.'},
{q:'Kapur بيختار الـ T اللي:',o:['بيقلل H_bg + H_fg','بيكبر H_bg + H_fg','بيخلي H_bg = H_fg','بيساوي متوسط البكسلات'],a:1,e:'T = arg max (H_bg + H_fg).'},
{q:'الـ Gx kernel بـ Sobel بيكشف:',o:['تغيّر عمودي ← edges أفقية','تغيّر أفقي ← edges عمودية','الألوان','الـ noise'],a:1,e:'Horizontal change → vertical edges.'},
{q:'Gx = 40 و Gy = 0. شو G و θ؟',o:['G = 40 ، θ = 0°','G = 1600 ، θ = 90°','G = 40 ، θ = 90°','G = 20 ، θ = 0°'],a:0,e:'√(40² + 0²) = 40، arctan(0/40) = 0° ← edge عمودي.'},
{q:'أي وحدة <b>مش</b> من تقنيات الـ edge detection الخمس بالسلايد؟',o:['Prewitt','Canny','Otsu','Roberts Cross'],a:2,e:'الخمس: Sobel, Prewitt, Canny, LoG, Roberts Cross.'}
]});

/* ---------- app shell ---------- */
const need=q=>Math.ceil(q.length*.8);
const unlocked=i=>i===0||!!store.all||store.passed[i-1];
const rail=()=>{$('#rail').innerHTML=L.map((l,i)=>`<button class="chip ${i===cur?'on':''} ${store.passed[i]?'done':''} ${unlocked(i)?'':'lock'}" data-i="${i}" ${unlocked(i)?'':'aria-disabled="true"'}><b>${store.passed[i]?'✓':unlocked(i)?i+1:'🔒'}</b>${l.t}</button>`).join('');
 $$('#rail .chip').forEach(b=>b.onclick=()=>go(+b.dataset.i));$('#openall').textContent=store.all?'رجّع قفل الدروس':'افتح كل الدروس';const n=store.passed.filter(Boolean).length;$('#mtxt').textContent=`${n} من 7`;$('#mbar').style.width=`${n/7*100}%`;
 const on=$('#rail .chip.on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'})};
let cur=0;
function quizHTML(i){const q=L[i].quiz;return`<section class="quiz" id="quiz"><h2>اختبار الدرس ${i+1}</h2><p>جاوب على ${q.length} أسئلة. لازم ${need(q)} صح على الأقل عشان ${i<6?'ينفتح الدرس الجاي':'تخلّص المختبر'}.${store.best[i]?` أفضل نتيجة إلك: ${store.best[i]} / ${q.length}`:''}</p>
${q.map((x,k)=>`<div class="q" data-k="${k}"><div class="qt">${k+1}. ${x.q}</div><div class="opts">${x.o.map((o,j)=>`<button data-j="${j}">${o}</button>`).join('')}</div><div class="ex">${x.e}</div></div>`).join('')}
<div class="qres"><button class="b main" id="check">صحّح</button><button class="b" id="retry" style="display:none">جرّب مرة ثانية</button><span class="score" id="score"></span><span id="qmsg"></span></div></section>`}
function bindQuiz(i){const q=L[i].quiz,ans=new Array(q.length).fill(-1);let done=false;
 $$('#quiz .q').forEach(el=>{const k=+el.dataset.k;$$('.opts button',el).forEach(b=>b.onclick=()=>{if(done)return;ans[k]=+b.dataset.j;$$('.opts button',el).forEach(x=>x.classList.toggle('pick',x===b))})});
 $('#check').onclick=()=>{if(ans.includes(-1)){toast('في أسئلة لسا ما جاوبتها');return}done=true;let s=0;$$('#quiz .q').forEach(el=>{const k=+el.dataset.k;el.classList.add('shown');$$('.opts button',el).forEach(b=>{const j=+b.dataset.j;b.classList.remove('pick');if(j===q[k].a)b.classList.add('right');else if(j===ans[k])b.classList.add('wrong')});if(ans[k]===q[k].a)s++});
  store.best[i]=Math.max(store.best[i]||0,s);const ok=s>=need(q);$('#score').textContent=`${s} / ${q.length}`;$('#check').style.display='none';$('#retry').style.display='';
  if(ok){const first=!store.passed[i];store.passed[i]=true;save();rail();$('#qmsg').innerHTML=i<6?`ممتاز، فاهم الدرس. <button class="b main" id="next">الدرس ${i+2}: ${L[i+1].t} ←</button>`:'خلّصت المختبر كله. راجع الأسئلة اللي غلطت فيها قبل الامتحان.';const n=$('#next');if(n)n.onclick=()=>go(i+1);if(first&&i<6)toast(`انفتح الدرس ${i+2}`)}
  else{save();$('#qmsg').textContent=`بدك ${need(q)} على الأقل. اقرأ الشرح تحت كل سؤال غلط، ارجع للأداة، وجرب مرة ثانية.`}};
 $('#retry').onclick=()=>{$('#quiz').outerHTML=quizHTML(i);bindQuiz(i)}}
function go(i,fromHash){if(!unlocked(i)){toast(`لازم تنجح باختبار الدرس ${i} أول`);return}cur=i;const l=L[i];ROs.forEach(o=>o.disconnect());ROs.length=0;
 $('#main').innerHTML=`<div class="lead"><div><p class="mute" style="margin:0">الدرس ${i+1} من 7 · <span class="en" style="font-weight:500">${l.h}</span></p><h2>${l.t}</h2><p style="margin:0">${l.intro}</p></div><div class="ctl" style="justify-content:flex-end"><a class="b" href="#quiz" style="text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);color:var(--ink)">روح للاختبار ↓</a></div></div>${l.html()}${quizHTML(i)}`;
 try{l.init($('#main'))}catch(e){console.error(e)}bindQuiz(i);rail();if(!fromHash){try{history.replaceState(null,'','#lesson-'+(i+1))}catch(e){}window.scrollTo({top:0})}}
$('#openall').onclick=()=>{store.all=!store.all;save();if(!unlocked(cur))cur=0;go(cur,true);toast(store.all?'انفتحت كل الدروس. الاختبارات لسا موجودة إذا بدك تتأكد من حالك.':'رجع القفل: كل درس بينفتح بعد ما تنجح باختبار اللي قبله.')};
$('#reset').onclick=()=>{if($('#reset').dataset.c){store={passed:[false,false,false,false,false,false,false],best:[0,0,0,0,0,0,0],all:false};save();delete $('#reset').dataset.c;$('#reset').textContent='ابدأ من الأول';go(0)}else{$('#reset').dataset.c=1;$('#reset').textContent='متأكد؟ اضغط مرة ثانية';setTimeout(()=>{delete $('#reset').dataset.c;$('#reset').textContent='ابدأ من الأول'},3000)}};
const fromH=()=>{const m=/^#lesson-(\d)$/.exec(location.hash);if(m){const i=+m[1]-1;if(i>=0&&i<7&&unlocked(i))return i}let j=0;while(j<6&&store.passed[j])j++;return j};
window.addEventListener('hashchange',()=>{if(!/^#lesson-\d$/.test(location.hash))return;const i=fromH();if(i!==cur)go(i,true)});
go(fromH(),true);
}
